const dbp=new Promise((res,rej)=>{const r=indexedDB.open('codelynx',2);r.onupgradeneeded=()=>['liked','playlists','history','local','offline'].forEach(n=>{if(!r.result.objectStoreNames.contains(n))r.result.createObjectStore(n,{keyPath:'id'})});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});

 kilpy:{label:'Kilpy',search:async q=>arr(await jget(`${K}/search?q=${enc(q)}&limit=15`)).map(kil)},
